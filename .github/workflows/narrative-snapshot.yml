name: Narrative daily snapshot

# Forward-archives one point per (source, category) for the /narrative
# dashboard (narrative dashboard RFC-4). Google Trends' short window, Reddit
# search and CoinGecko "trending" keep no history we can fetch later, so a
# day this workflow doesn't capture is gone. Points are dated by the UTC day
# the run actually executes, so a run that crosses UTC midnight files the
# point under the wrong day and loses the intended one (the old 23:00 UTC
# slot did exactly that and left 2026-09-25 with no point at all).
# Scheduled for 12:47 UTC: GitHub started these runs
# 2h39m-5h01m late on 2026-09-27/28 (measured from the Actions run list,
# 2026-09-29), and on 2026-09-29/30 narrative and liqtide were about 4h
# late (narrative 4h02m/4h01m, liqtide 3h52m/3h52m), so it varies by hours
# rather than growing steadily; 12:47 survives a 10h delay budget. The
# first step warns if a scheduled run started after UTC midnight.
# Runs 30 minutes after chain-growth-snapshot.yml and 30 before
# liqtide-snapshot.yml, so the pushes to main don't overlap. Pinned by
# api/tests/scripts/test_snapshot_workflow_schedules.py.
#
# No secrets: without REDDIT_CLIENT_ID/REDDIT_CLIENT_SECRET the Reddit
# source is skipped and logged as "credentials-not-configured" (ADR-8).
on:
  schedule:
    - cron: "47 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: narrative-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Warn when the run crossed UTC midnight
        if: github.event_name == 'schedule'
        run: |
          cron_hour=12   # must equal this workflow's cron hour
          now_hour=$((10#$(date -u +%H)))
          if [ "$now_hour" -lt "$cron_hour" ]; then
            echo "::warning::scheduled for ${cron_hour}:xx UTC but started at $(date -u +%H:%M) UTC - the run crossed UTC midnight; today's no-history point may be dated the wrong day"
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install api/ dependencies
        run: uv sync --project api

      - name: Run snapshot
        id: snapshot
        run: |
          set +e
          # pytrends is optional in api/pyproject.toml; add it for this run only.
          uv run --project api --with pytrends python -m api.scripts.snapshot_narrative
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 2 = every source unavailable -- warn, still commit whatever
          # exists. Only exit 1 (unexpected crash) fails the job.
          if [ "$code" -eq 1 ]; then
            exit 1
          fi

      - name: Warn when every source was unavailable
        if: steps.snapshot.outputs.exit_code == '2'
        run: |
          echo "::warning::snapshot_narrative.py - every narrative source was unavailable, see the job log above"

      - name: Commit archived points
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/data/cache/narrative/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore: narrative snapshot $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
