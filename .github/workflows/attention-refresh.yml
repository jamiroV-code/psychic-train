name: Attention daily refresh

# Refreshes the narrative attention store (Wikipedia, CoinGecko, top-100
# universe, then the category snapshot) once a day, so the My baskets and
# Discovery tabs do not go stale between owner-PC runs (narrative baskets T84).
# Scheduled for 07:23 UTC, off the hour and clear of the other snapshot
# workflows (11:17-13:17 UTC) so the pushes to main do not overlap.
#
# FAILS LOUDLY: the job exits non-zero if any default source reports an
# error or 0 ok series, or if a series source's newest completed UTC day is stale,
# and prints one summary line per source. Stale data must never look fresh.
# Whatever did refresh is still committed (the commit step runs after a
# failure) so a partial outage does not lose good days.
#
# A source fails on freshness only if its latest stored completed day is stale
# (wikipedia > 3 days old, coingecko > 2); a same-day rerun adding no newer day
# is fine. record_probe.py then records the probe only for sources that
# refreshed ok, and the commit includes api/data/attention/probe_records.json.
# Not run here: X (insufficient-history until 90 own days).
# A second job, refresh-extra (needs: refresh, runs even if refresh is red), adds
# Binance and Hyperliquid volume, Google Trends and Reddit as separate
# continue-on-error steps after refresh has pushed, so the two never push at
# once. Provider blocks (Binance 451, Reddit 403/429, Trends 429 from cloud IPs)
# become `unavailable` with a yellow ::warning:: and no probe record; only code
# errors or a missing result line turn that job red. Reddit runs only when the
# repo secrets REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET exist; never echoed.
# The optional X step runs only when the repo secret X_BEARER_TOKEN exists AND
# the repo variable ATTENTION_X_LIVE is 1. The token is never echoed.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "Also run --sources categories (10 slow CoinGecko calls)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: attention-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      RUN_CATEGORIES: ${{ github.event_name == 'schedule' || inputs.categories }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install api/ dependencies
        run: uv sync --project api

      - name: Refresh default sources
        run: |
          set -o pipefail
          uv run --project api python api/scripts/refresh_attention.py 2>&1 | tee "$RUNNER_TEMP/default.log"

      - name: Refresh category snapshot
        if: ${{ !cancelled() && env.RUN_CATEGORIES == 'true' }}
        run: |
          set -o pipefail
          uv run --project api python api/scripts/refresh_attention.py --sources categories 2>&1 | tee "$RUNNER_TEMP/categories.log"

      - name: Check whether the optional X step is enabled
        id: xgate
        if: ${{ !cancelled() }}
        env:
          HAS_X_TOKEN: ${{ secrets.X_BEARER_TOKEN != '' }}
          X_LIVE_VAR: ${{ vars.ATTENTION_X_LIVE }}
        run: |
          if [ "$HAS_X_TOKEN" = "true" ] && [ "$X_LIVE_VAR" = "1" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh X (optional, off unless the secret and variable exist)
        if: ${{ !cancelled() && steps.xgate.outputs.enabled == 'true' }}
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_LIVE: "1"
        run: |
          uv run --project api python api/scripts/refresh_attention.py --sources xsearch

      - name: Verify every source refreshed and the store is not stale
        if: ${{ !cancelled() }}
        run: |
          uv run --project api python - <<'PY'
          import os, re, sys
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          from api.scripts import attention_freshness
          tmp = Path(os.environ["RUNNER_TEMP"])
          today = datetime.now(timezone.utc).date()
          log = (tmp / "default.log").read_text() if (tmp / "default.log").exists() else ""
          if (tmp / "categories.log").exists():
              log += "\n" + (tmp / "categories.log").read_text()
          sources = ["wikipedia", "coingecko", "universe"]
          if (tmp / "categories.log").exists():
              sources.append("categories")
          bad, good = [], []
          for src in sources:
              lines = [ln for ln in log.splitlines() if ln.startswith(src + ":")]
              line = lines[-1] if lines else f"{src}: no result line"
              status = "ok"
              if not lines or " error " in line + " ":
                  status = "FAILED"
              elif src in ("wikipedia", "coingecko"):
                  m = re.match(rf"{src}: (\d+)/(\d+) ok", line)
                  if not m or int(m.group(1)) == 0:
                      status = "FAILED"
                  else:
                      days = [pd.read_parquet(p)["date"].max()
                              for p in Path("api/data/cache/attention", src).glob("*.parquet")]
                      latest = max(days).date().isoformat() if days else None
                      v = attention_freshness.judge(src, latest, today)
                      line += f", latest day {latest}, stale before {v.threshold}"
                      if not v.ok:
                          status = f"FAILED ({v.reason})"
              if status == "ok":
                  good.append(src)
              else:
                  bad.append(src)
              print(f"summary {src}: {status} - {line}")
          # Sources that refreshed ok: the only ones the probe step may record.
          (tmp / "attention-ok.txt").write_text(",".join(s for s in good if s in ("wikipedia", "coingecko")))
          if bad:
              print(f"::error::attention refresh failed for: {', '.join(bad)}")
              sys.exit(1)
          PY

      - name: Record the source probe for sources that refreshed ok
        if: ${{ !cancelled() }}
        run: |
          ok=""
          [ -f "$RUNNER_TEMP/attention-ok.txt" ] && ok="$(cat "$RUNNER_TEMP/attention-ok.txt")"
          if [ -z "$ok" ]; then
            echo "no source refreshed ok; no probe recorded"
            exit 0
          fi
          uv run --project api python api/scripts/record_probe.py --sources "$ok"

      - name: Commit refreshed attention data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # api/data/cache/* is gitignored, so force-add the one store dir.
          [ -d api/data/cache/attention ] || { echo "nothing new to commit"; exit 0; }
          git add -f api/data/cache/attention/
          git add -f api/data/attention/probe_records.json
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore: attention refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1

  refresh-extra:
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The branch head, not the trigger sha: it includes what `refresh` just pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v3

      - name: Install api/ dependencies
        run: uv sync --project api

      - name: Refresh Binance volume (HTTP 451 from US runners is expected)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -o pipefail
          uv run --project api python api/scripts/refresh_attention.py --sources exchange_volume 2>&1 | tee "$RUNNER_TEMP/extra-exchange_volume.log"

      - name: Refresh Hyperliquid volume
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -o pipefail
          uv run --project api python api/scripts/refresh_attention.py --sources hyperliquid_volume 2>&1 | tee "$RUNNER_TEMP/extra-hyperliquid_volume.log"

      # pytrends is installed per run (exact pin, api/pyproject.toml untouched). The fetcher's own
      # budget is 540 s (TRENDS_TIME_BUDGET_S) plus install, one in-flight request and the store
      # write, so the step limit is 14 min. A Google refusal is a provider block (yellow, other
      # steps still run); the verify step below still turns red on a code error. The failure class
      # line comes from the same classifier the verify step uses (attention_extra.classify).
      - name: Refresh Google Trends (HTTP 429 from cloud IPs is common)
        continue-on-error: true
        timeout-minutes: 14
        run: |
          rc=0
          set -o pipefail
          uv run --project api --with pytrends==4.9.2 python api/scripts/refresh_attention.py --sources trends 2>&1 | tee "$RUNNER_TEMP/extra-trends.log" || rc=$?
          grep '^trends detail:' "$RUNNER_TEMP/extra-trends.log" || echo "trends detail: not printed"
          uv run --project api python - <<'PY'
          import os
          from pathlib import Path
          from api.scripts import attention_extra
          p = Path(os.environ["RUNNER_TEMP"]) / "extra-trends.log"
          lines = [ln for ln in (p.read_text() if p.exists() else "").splitlines() if ln.startswith("trends:")]
          r = attention_extra.classify("trends", lines[-1] if lines else None)
          cls = {"ok": "none", "unavailable": "provider block (429/ConnectionError/capped)",
                 "failed": "code error", "not-probed": "not probed"}.get(r.status, r.status)
          print(f"trends failure-class: {cls} - {r.detail}")
          PY
          exit "$rc"

      - name: Check whether the Reddit credentials exist
        id: redditgate
        env:
          HAS_REDDIT: ${{ secrets.REDDIT_CLIENT_ID != '' && secrets.REDDIT_CLIENT_SECRET != '' }}
        run: |
          if [ "$HAS_REDDIT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reddit: not-probed no credentials" > "$RUNNER_TEMP/extra-reddit.log"
          fi

      - name: Refresh Reddit (only when both secrets exist)
        if: ${{ steps.redditgate.outputs.enabled == 'true' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          set -o pipefail
          uv run --project api python api/scripts/refresh_attention.py --sources reddit 2>&1 | tee "$RUNNER_TEMP/extra-reddit.log"

      - name: Verify the extra sources (provider blocks warn, code errors fail)
        if: ${{ !cancelled() }}
        run: uv run --project api python api/scripts/attention_extra.py

      - name: Record the source probe for extra sources that refreshed ok
        if: ${{ !cancelled() }}
        run: |
          ok=""
          [ -f "$RUNNER_TEMP/attention-extra-ok.txt" ] && ok="$(cat "$RUNNER_TEMP/attention-extra-ok.txt")"
          if [ -z "$ok" ]; then
            echo "no extra source refreshed ok; no probe recorded"
            exit 0
          fi
          uv run --project api python api/scripts/record_probe.py --sources "$ok"

      - name: Commit refreshed attention data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d api/data/cache/attention ] || { echo "nothing new to commit"; exit 0; }
          git add -f api/data/cache/attention/
          git add -f api/data/attention/probe_records.json
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore: attention extra refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
