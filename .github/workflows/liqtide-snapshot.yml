name: LiqTide daily snapshot

# LiqTide (liqtide.com) publishes only "latest" -- there is no historical
# endpoint. A day this workflow doesn't capture is gone forever (Standing
# Rule 8, data-sources/all-data-sources.md). LiqTide actually publishes
# around 00:25-01:12 UTC (observed `generated_utc`), and the archive file is
# keyed by generated_utc[:10], not by when this job runs, so a run is safe as
# long as it lands before the next publish. Scheduled for 13:17 UTC, ~12h
# after that day's publish: GitHub started these runs
# 2h39m-5h01m late on 2026-09-27/28 (measured from the Actions run list,
# 2026-09-29), and on 2026-09-29/30 narrative and liqtide were about 4h
# late (narrative 4h02m/4h01m, liqtide 3h52m/3h52m), so it varies by hours
# rather than growing steadily; 13:17 survives a 10h delay budget. The
# first step warns if a scheduled run started after UTC midnight. Runs 30
# minutes after narrative-snapshot.yml and 60 after chain-growth-snapshot.yml,
# so the pushes to main don't overlap. Pinned by
# api/tests/scripts/test_snapshot_workflow_schedules.py.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: liqtide-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Warn when the run crossed UTC midnight
        if: github.event_name == 'schedule'
        run: |
          cron_hour=13   # must equal this workflow's cron hour
          now_hour=$((10#$(date -u +%H)))
          if [ "$now_hour" -lt "$cron_hour" ]; then
            echo "::warning::scheduled for ${cron_hour}:xx UTC but started at $(date -u +%H:%M) UTC - the run crossed UTC midnight; today's no-history point may be dated the wrong day"
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install api/ dependencies
        run: uv sync --project api

      - name: Run snapshot
        id: snapshot
        run: |
          set +e
          uv run --project api python api/scripts/snapshot_liqtide.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 2 = archived but a check flagged something (e.g. LiqTide
          # changed its own published methodology) -- surface it as a warning,
          # don't fail the job. Only exit 1 (fetch/write failed outright) fails.
          if [ "$code" -eq 1 ]; then
            exit 1
          fi

      - name: Warn on flagged snapshot
        if: steps.snapshot.outputs.exit_code == '2'
        run: echo "::warning::snapshot_liqtide.py flagged a check -- see the job log above"

      - name: Commit archived payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/data/cache/liqtide/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore: liqtide snapshot $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
