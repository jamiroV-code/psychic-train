name: Chain-growth daily snapshot

# Archives the full daily active-address and transaction series per chain
# (chain-growth RFC-3) from growthepie, plus the L2BEAT transactions
# cross-check. Providers revise recent days and may drop deep history, so the
# merged series is committed. Scheduled for 12:17 UTC (off the top of the
# hour, which GitHub's scheduler handles better). GitHub started these runs
# 2h39m-5h01m late on 2026-09-27/28 (measured from the Actions run list,
# 2026-09-29), and on 2026-09-29/30 narrative and liqtide were about 4h
# late (narrative 4h02m/4h01m, liqtide 3h52m/3h52m), so it varies by hours
# rather than growing steadily; 12:17 survives a
# 10h delay budget. The first step warns if a scheduled run started after
# UTC midnight. Runs 30 minutes before narrative-snapshot.yml and 60 before
# liqtide-snapshot.yml, so the pushes to main don't overlap. Pinned by
# api/tests/scripts/test_snapshot_workflow_schedules.py.
#
# No secrets: both sources are keyless.
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chain-growth-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Warn when the run crossed UTC midnight
        if: github.event_name == 'schedule'
        run: |
          cron_hour=12   # must equal this workflow's cron hour
          now_hour=$((10#$(date -u +%H)))
          if [ "$now_hour" -lt "$cron_hour" ]; then
            echo "::warning::scheduled for ${cron_hour}:xx UTC but started at $(date -u +%H:%M) UTC - the run crossed UTC midnight; today's no-history point may be dated the wrong day"
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install api/ dependencies
        run: uv sync --project api

      - name: Run snapshot
        id: snapshot
        run: |
          set +e
          uv run --project api python -m api.scripts.snapshot_chain_growth
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 2 = every series unavailable -- warn, still commit whatever
          # exists. Only exit 1 (unexpected crash) fails the job.
          if [ "$code" -eq 1 ]; then
            exit 1
          fi

      - name: Warn when every series was unavailable
        if: steps.snapshot.outputs.exit_code == '2'
        run: |
          echo "::warning::snapshot_chain_growth.py - every chain-growth series was unavailable, see the job log above"

      - name: Commit archived series
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/data/cache/onchain/
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore: chain-growth snapshot $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
