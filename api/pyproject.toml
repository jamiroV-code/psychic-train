[project]
name = "api"
version = "0.1.0"
description = "Momentum screener backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta-classic>=0.8.32",
    "ccxt>=4.3",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "httpx>=0.27",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# W8d2 (SPEC rules 17-20, AC41, AC53): the X reader. Never installed by default or in CI; the owner's 24/7 host
# installs it with `uv sync --project api --frozen --group xreader`. twscrape is pinned by its full commit (the
# version string is no guard); its own dependencies are pinned exactly here and every package, curl-cffi's wheels
# included, is hash-pinned in uv.lock. Packages shared with the main environment keep the main lock's versions.
xreader = [
    "twscrape @ git+https://github.com/vladkens/twscrape@63f61a518e576ea5c132f1156c03dda0520d76c1",
    "aiosqlite==0.22.1",
    "beautifulsoup4==4.15.0",
    "soupsieve==3.0.3",
    "fake-useragent==2.2.0",
    "loguru==0.7.3",
    "py-machineid==1.0.0",
    "pyotp==2.10.0",
    "curl-cffi==0.16.3",
]

[tool.uv]
# curl-cffi's sdist downloads its impersonation binary without a checksum: wheels only (rule 19g).
no-build-package = ["curl-cffi"]
# The pinned twscrape commit builds with hatchling from source; its build backend is pinned (rule 20a).
build-constraint-dependencies = ["hatchling==1.32.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
# RFC-005: opt-in real-network gate. Deselected by default; run explicitly
# with `-m integration`.
markers = [
    "integration: hits the real exchange over the network (deselected by default)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics", "data", "models", "routers"]
