[project]
name = "api"
version = "0.1.0"
description = "Momentum screener backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta-classic>=0.8.32",
    "ccxt>=4.3",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
# RFC-005: opt-in real-network gate. Deselected by default; run explicitly
# with `-m integration`.
markers = [
    "integration: hits the real exchange over the network (deselected by default)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analytics", "data", "models", "routers"]
